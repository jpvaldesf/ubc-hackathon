[project]
name = "deposit-keeper-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.8.0",
    "fastapi>=0.163.1",
    "pillow==13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
    "web3==8.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
