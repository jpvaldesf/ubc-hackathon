# Render Blueprint for the Deposit Keeper API (Arc testnet only). Setup steps: server/README.md "Hosting".
# Secrets are marked sync: false, so Render asks for them in the dashboard; they never go in this file.
services:
  - type: web
    name: deposit-keeper-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb # paid: the free plan has no persistent disk
    region: oregon
    branch: main
    healthCheckPath: /health
    disk:
      name: dk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Secrets: paste in the Render dashboard
      - key: LANDLORD_PRIVATE_KEY
        sync: false
      - key: TENANT_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Leases, photos and the daily caps live on the disk
      - key: DK_DATA_DIR
        value: /var/data
      # Comma-separated browser origins allowed to call the API. Enter at setup:
      # https://deposit-keeper-demo.vercel.app,https://<static site>.onrender.com
      - key: DK_CORS_ORIGINS
        sync: false
      # D-012 limits for the public demo
      - key: DK_MAX_LEASES_PER_DAY
        value: "5"
      - key: DK_MAX_REPORTS_PER_DAY
        value: "10"
      - key: DK_MAX_DEPOSIT_CENTS
        value: "1000"
      # Open mode until the app sends X-Demo-Token: enter 1 at setup. Later add DK_DEMO_TOKEN in the
      # dashboard and delete this variable (server/README.md). Dashboard-managed so a blueprint sync
      # can't switch open mode back on.
      - key: DK_ALLOW_OPEN
        sync: false

  # Marcus's app (app/, unchanged) as a free static site in live mode, so the team can use it 24/7.
  - type: web
    name: deposit-keeper-app
    runtime: static
    rootDir: app
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite # client-side routes like /leases/<id>
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ADAPTER
        value: live
      # The API service's URL, e.g. https://deposit-keeper-api.onrender.com (enter at setup)
      - key: VITE_API_URL
        sync: false
      # D-012 demo token, same value as the API's DK_DEMO_TOKEN (enter at setup; ships in the public bundle)
      - key: VITE_DEMO_TOKEN
        sync: false
